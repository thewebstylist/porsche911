<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porsche 911 Cabriolet — Rear-to-Front Pan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 4rem 5vw;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55) 0%, transparent 45%);
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero p {
      margin-top: 0.75rem;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      opacity: 0.85;
      max-width: 40ch;
    }
  </style>
</head>
<body>
  <section class="hero">
    <video autoplay muted loop playsinline poster="https://d8j0ntlcm91z4.cloudfront.net/user_2vQdbkYJJTfppgV7PaStt9K0SSy/hf_20260706_063103_3f727e90-7c57-4e0c-96da-f8c0a079bf6d.png">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_2vQdbkYJJTfppgV7PaStt9K0SSy/hf_20260706_063300_8dda1fc5-3cbb-430d-88b2-13ab41850007.mp4" type="video/mp4" />
    </video>
    <div class="overlay">
      <h1>911 Cabriolet</h1>
      <p>A slow pan from tail to nose &mdash; open air, open landscape.</p>
    </div>
  </section>
</body>
</html>
