<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porsche Crest — Exploded View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 3rem;
      pointer-events: none;
    }

    .hero p {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <section class="hero">
    <video autoplay muted loop playsinline poster="https://d8j0ntlcm91z4.cloudfront.net/user_2vQdbkYJJTfppgV7PaStt9K0SSy/hf_20260706_064159_f8c1966f-808f-40df-b3b2-bc023233d262.png">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_2vQdbkYJJTfppgV7PaStt9K0SSy/hf_20260706_064241_271d1f41-e0b8-4d89-8e72-a7b2adad801c.mp4" type="video/mp4" />
    </video>
    <div class="overlay">
      <p>Crafted in every layer</p>
    </div>
  </section>
</body>
</html>
